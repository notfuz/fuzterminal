<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuz Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="scene"></canvas>
    <div id="terminal">
        <div id="terminal-header">
            <div class="traffic">
                <span class="red"></span>
                <span class="yellow"></span>
                <span class="green"></span>
            </div>
            <div class="title">
                fuz@website
            </div>
        </div>
        <div id="terminal-body">
            <div class="line info">
                Welcome to my website.
            </div>
            <div class="line info">
                Type <span class="cmd">help</span> to see all available commands.
            </div>
            <div id="output"></div>
            <div id="input-line">
                <span class="prompt">
                    <span class="user">fuz</span>@<span class="host">website</span>:~$
                </span>
                <span id="terminal-text" class="typed-command"></span>
                <span id="cursor">▌</span>
                <input id="real-input" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>
    <div class="vignette"></div>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/terminal.js"></script>
</body>
</html>
