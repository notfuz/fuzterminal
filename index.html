<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuz Terminal</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="scene"></canvas>
    <div id="terminal">
        <div id="terminal-header">
            <div class="traffic">
                <span class="red"></span>
                <span class="yellow"></span>
                <span class="green"></span>
            </div>
            <div class="title">
                fuz@terminal
            </div>
        </div>
        <div id="terminal-body">
            <div class="line info">
                Welcome to my website.
            </div>
            <div class="line info">
                Type <span class="cmd">help</span> to see all available commands.
            </div>
            <div id="output"></div>
            <div id="input-line">
                <span class="prompt">
                    <span class="user">fuz</span>@<span class="host">terminal</span>:~$
                </span>
                <span id="terminal-text" class="typed-command"></span>
                <span id="cursor">▌</span>
                <input id="real-input" autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>
    <div id="gallery-overlay">
    <div id="gallery-window">
        <div id="gallery-header">
            <div class="traffic">
                <span class="red"></span>
                <span class="yellow"></span>
                <span class="green"></span>
            </div>
            <div class="title">
                gallery@terminal
            </div>
        </div>
        <div id="gallery-content">
        </div>
    </div>
</div>
<div id="lightbox">

    <div id="lightbox-viewport">

        <img id="lightbox-image" draggable="false">

    </div>
    
    <button id="lightbox-prev">&#10094;</button>
    <button id="lightbox-next">&#10095;</button>

    <div id="lightbox-ui">

        <div id="lightbox-caption"></div>

        <div id="lightbox-counter"></div>

    </div>

    <span id="lightbox-close">&times;</span>

</div>
</div>
    <div class="vignette"></div>
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/terminal.js"></script>
</body>
</html>
